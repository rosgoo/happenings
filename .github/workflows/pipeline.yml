name: pipeline

# Once a day, before the morning. A 48-hour-stale events index is broken, but
# the three-a-day schedule this replaced was answering a question nobody asked:
# the sources are read in full each run rather than incrementally, so a midday
# pass re-fetched 40,000 rows to learn that tonight's listings were the same
# listings. Daily is the honest floor -- it is what "what's on today" needs,
# and no more of somebody else's bandwidth than that.
#
# `workflow_dispatch` is the escape hatch when a source lands something worth
# publishing before tomorrow.
on:
  schedule:
    - cron: '15 9 * * *'         # 05:15 America/New_York
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # raw/ is gitignored: it churns every run and git would store a fresh
      # multi-MB blob each time for no diffing benefit. Cached between runs so a
      # failed transform can be re-run without re-fetching.
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The one registry that belongs on the fetch clock rather than
      # discover.yml's. Every other one is expensive and near-static, so it is
      # re-learned twice a week; this is four requests for the whole city -- a
      # sitemap index and three member sitemaps -- and the answer changes daily,
      # because events are born and cancelled constantly. Left on the discovery
      # clock it would be up to three days stale, which for this source means
      # missing the new shows and still listing the cancelled ones. It also has
      # to run BEFORE Extract, because fetch.py reads the registry it writes.
      - name: DICE registry
        env:
          HAPPENINGS_CONTACT: https://happenings.town
        run: python3 dice.py

      - name: Extract
        env:
          HAPPENINGS_CONTACT: https://happenings.town
          # Ticketmaster is the only keyed source. Without this the adapter
          # raises, fetch.py counts a failure and the whole job exits 1 --
          # which is the correct behaviour, but it means the secret is not
          # optional. Set it at Settings > Secrets > Actions.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python3 fetch.py

      # Placing new locations belongs in the regular run, not in a human's
      # hands. Permit rows arrive with street strings rather than coordinates,
      # and every run brings names the gazetteer has never seen -- left out of
      # CI, neighbourhood coverage decays quietly from its current 86%.
      # Resumable and cached, so a normal run is a handful of requests.
      - name: Geocode new locations
        run: python3 geocode.py

      - name: Transform
        run: python3 normalize.py

      # The gate runs BEFORE the commit, because the commit is the deploy.
      # Exit 1 here is the thing standing between a broken adapter and a live
      # site that silently lists nothing.
      - name: Quality gate
        run: python3 validate.py

      # rejected.json is gitignored -- 4 MB regenerated every run, served to
      # nobody. It is still the only way to audit what the classifier threw
      # away, so it is kept here instead: retained, downloadable, and outside
      # git history where it was doubling the repo's growth.
      - name: Keep the dead-letter queue as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-${{ github.run_id }}
          path: data/*/rejected.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit
        run: |
          git config user.name  "happenings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          # And the DICE registry, which this job regenerates and so is
          # entitled to commit. Named specifically rather than `git add
          # cities/`, which would sweep up a hand-edited source registry or a
          # discover.yml run's roster that this job never touched.
          git add cities/*/dice.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # discover.yml pushes to the same branch, and its monthly CMS sweep
            # runs for the better part of an hour -- long enough to overlap one
            # of these three daily runs. Without the rebase whichever finishes
            # second is rejected and discards a complete, validated build.
            git pull --rebase --autostash
            git push
          fi
